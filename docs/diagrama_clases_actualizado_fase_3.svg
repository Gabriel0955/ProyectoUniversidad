<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .pkg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 8; }
      .class { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 6; }
      .head { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
      .name { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Consolas, monospace; fill: #1f2937; }
      .pkgtext { font: 700 15px Arial, sans-serif; fill: #475569; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .agg { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#diamond); }
      .label { font: 13px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <marker id="diamond" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,5 L6,1 L13,5 L6,9 z" fill="#ffffff" stroke="#475569" />
    </marker>
  </defs>

  <text x="40" y="50" class="title">Sistema de Reservas de Canchas Deportivas - Diagrama de clases actualizado</text>

  <rect x="30" y="80" width="880" height="610" class="pkg"/>
  <text x="50" y="108" class="pkgtext">reservas.models</text>

  <rect x="60" y="140" width="250" height="120" class="class"/>
  <rect x="60" y="140" width="250" height="34" class="head"/>
  <text x="145" y="163" class="name">Client</text>
  <text x="78" y="198" class="text">+ identification: str</text>
  <text x="78" y="222" class="text">+ name: str</text>
  <text x="78" y="246" class="text">+ email: str</text>

  <rect x="60" y="330" width="250" height="140" class="class"/>
  <rect x="60" y="330" width="250" height="34" class="head"/>
  <text x="149" y="353" class="name">Court</text>
  <text x="78" y="388" class="text">+ court_id: str</text>
  <text x="78" y="412" class="text">+ name: str</text>
  <text x="78" y="436" class="text">+ sport: str</text>
  <text x="78" y="460" class="text">+ active: bool</text>

  <rect x="370" y="140" width="250" height="168" class="class"/>
  <rect x="370" y="140" width="250" height="34" class="head"/>
  <text x="458" y="163" class="name">TimeSlot</text>
  <text x="388" y="198" class="text">+ start_at: datetime</text>
  <text x="388" y="222" class="text">+ duration_hours: int</text>
  <text x="388" y="246" class="text">+ end_at: datetime</text>
  <text x="388" y="282" class="text">+ overlaps(other): bool</text>

  <rect x="370" y="370" width="250" height="100" class="class"/>
  <rect x="370" y="370" width="250" height="34" class="head"/>
  <text x="424" y="393" class="name">ReservationStatus</text>
  <text x="388" y="428" class="text">CONFIRMED</text>
  <text x="388" y="452" class="text">CANCELLED</text>

  <rect x="660" y="140" width="220" height="240" class="class"/>
  <rect x="660" y="140" width="220" height="34" class="head"/>
  <text x="722" y="163" class="name">Reservation</text>
  <text x="678" y="198" class="text">+ reservation_id: str</text>
  <text x="678" y="222" class="text">+ client: Client</text>
  <text x="678" y="246" class="text">+ court: Court</text>
  <text x="678" y="270" class="text">+ time_slot: TimeSlot</text>
  <text x="678" y="294" class="text">+ status: ReservationStatus</text>
  <text x="678" y="318" class="text">+ notes: str</text>
  <text x="678" y="350" class="text">+ is_confirmed(): bool</text>
  <text x="678" y="374" class="text">+ cancel(reason): void</text>

  <rect x="660" y="440" width="220" height="220" class="class"/>
  <rect x="660" y="440" width="220" height="34" class="head"/>
  <text x="690" y="463" class="name">ReservationRequest</text>
  <text x="678" y="498" class="text">+ client_identification</text>
  <text x="678" y="522" class="text">+ client_name</text>
  <text x="678" y="546" class="text">+ client_email</text>
  <text x="678" y="570" class="text">+ court_id</text>
  <text x="678" y="594" class="text">+ court_name</text>
  <text x="678" y="618" class="text">+ sport</text>
  <text x="678" y="642" class="text">+ start_at / duration</text>

  <rect x="950" y="80" width="410" height="245" class="pkg"/>
  <text x="970" y="108" class="pkgtext">reservas.service</text>
  <rect x="980" y="140" width="340" height="155" class="class"/>
  <rect x="980" y="140" width="340" height="34" class="head"/>
  <text x="1085" y="163" class="name">ReservationService</text>
  <text x="998" y="198" class="text">+ create_reservation(...)</text>
  <text x="998" y="222" class="text">+ create_reservation_from_request(request)</text>
  <text x="998" y="246" class="text">+ check_availability(...): bool</text>
  <text x="998" y="270" class="text">+ cancel_reservation(id, reason)</text>

  <rect x="950" y="370" width="410" height="220" class="pkg"/>
  <text x="970" y="398" class="pkgtext">reservas.repository</text>
  <rect x="980" y="430" width="340" height="130" class="class"/>
  <rect x="980" y="430" width="340" height="34" class="head"/>
  <text x="1040" y="453" class="name">InMemoryReservationRepository</text>
  <text x="998" y="488" class="text">+ save(reservation)</text>
  <text x="998" y="512" class="text">+ find_by_id(id)</text>
  <text x="998" y="536" class="text">+ has_active_conflict(...): bool</text>

  <rect x="950" y="635" width="410" height="270" class="pkg"/>
  <text x="970" y="663" class="pkgtext">support</text>
  <rect x="980" y="695" width="340" height="85" class="class"/>
  <rect x="980" y="695" width="340" height="34" class="head"/>
  <text x="1070" y="718" class="name">ReservationValidator</text>
  <text x="998" y="753" class="text">+ validate_client/court/period/notes</text>
  <rect x="980" y="810" width="340" height="65" class="class"/>
  <rect x="980" y="810" width="340" height="34" class="head"/>
  <text x="1072" y="833" class="name">NotificationService</text>
  <text x="998" y="858" class="text">+ send(destination, message)</text>

  <path d="M660 210 L310 200" class="line"/>
  <text x="460" y="196" class="label">1 cliente</text>
  <path d="M660 250 L310 400" class="line"/>
  <text x="455" y="338" class="label">1 cancha</text>
  <path d="M660 270 L620 230" class="agg"/>
  <text x="624" y="242" class="label">1 horario</text>
  <path d="M660 304 L620 420" class="line"/>
  <path d="M980 210 L880 250" class="line"/>
  <path d="M980 245 L880 540" class="line"/>
  <path d="M1150 295 L1150 430" class="line"/>
  <path d="M1150 295 L1150 695" class="line"/>
  <path d="M1220 295 L1220 810" class="line"/>
  <path d="M980 495 L880 300" class="agg"/>
</svg>
